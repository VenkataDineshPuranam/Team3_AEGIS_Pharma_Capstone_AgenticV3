# V3 CI -- what has to be true before a change can be deployed.
name: V3 CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # so cd.yml can require a green CI before it builds anything

# A second push to the same branch cancels the first. Deliberately NOT applied to
# `main`/`stage-*` pushes, which are what cd.yml gates on -- cancelling one of those would
# leave a deployed commit with no completed CI run behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Governance gates. First job on purpose: these are the checks that fail when
  # someone edits a system prompt, a prohibition contract or a tool schema without
  # the corresponding review artifact being regenerated. Finding that out after a
  # ten-minute test matrix wastes everyone's time.
  # ---------------------------------------------------------------------------
  governance:
    name: Governance & AI supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dependency SBOM matches the installed environment
        run: python3 security/sbom/verify_sbom.py

      - name: AI-BOM matches live prompts, PI/PG ruleset and governance artifacts
        # Fails if a system prompt, the prompt-injection pattern set, the prohibition
        # contract or the tool manifest changed without security/sbom/ai_sbom.json being
        # regenerated. That is the whole control: a prompt edit that weakens a
        # governance instruction cannot reach a deployment without appearing as a hash
        # diff in a pull request.
        run: python3 security/sbom/verify_ai_sbom.py

      - name: Tool contracts are unmodified and still read-only
        run: python3 -c "from services.integration import tool_manifest; tool_manifest.verify_manifest(); print('tool manifest verified')"

      - name: No secrets committed
        # Blocks the specific mistake this repo is exposed to: .env is gitignored, so the
        # realistic failure is someone force-adding it or pasting a key into a source
        # file. Not a general-purpose scanner -- it checks for provider key prefixes and
        # for .env being tracked at all.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi
          if git grep -nIE '(sk-ant-api[0-9]{2}-|gsk_[A-Za-z0-9]{40,})' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::A provider API key appears to be committed."
            exit 1
          fi
          echo "No committed secrets found."

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check packages services security infra quality tests

      - name: Tests
        # `-m "not live"` excludes the tests that need a real provider key. Those are not
        # skipped silently: they carry their own skipif with a BLOCKED_BY_ENVIRONMENT
        # reason, and the live red-team suite runs in nightly-redteam.yml where a real key
        # is available. A pull request from a fork has no secrets, so gating on them here
        # would mean no fork could ever pass CI.
        #
        # AZURE_FOUNDRY_* only needs to be PRESENT, not valid: services/api/main.py
        # constructs the LLM client at import time (LLM_PROVIDER defaults to
        # azure_foundry as of Stage 23), so test collection fails on a missing var even
        # though `not live` tests never call the API. Same placeholders used below.
        env:
          AZURE_FOUNDRY_ENDPOINT: "https://ci-placeholder.openai.azure.com"
          AZURE_FOUNDRY_API_KEY: "ci-placeholder-not-a-real-key"
          AZURE_FOUNDRY_DEPLOYMENT: "ci-placeholder"
        run: pytest -m "not live" -q --durations=10

      - name: API imports and serves without a provider key
        # ADR-007's degraded mode, asserted rather than assumed: the app must start and
        # answer /api/health with no AZURE_FOUNDRY_API_KEY present, because that is
        # exactly the state a misconfigured deployment is in and it must fail visibly at
        # the request, not opaquely at import.
        env:
          LLM_PROVIDER: azure_foundry
          AZURE_FOUNDRY_ENDPOINT: "https://ci-placeholder.openai.azure.com"
          AZURE_FOUNDRY_API_KEY: "ci-placeholder-not-a-real-key"
          AZURE_FOUNDRY_DEPLOYMENT: "ci-placeholder"
        run: |
          python3 - <<'PY'
          from fastapi.testclient import TestClient
          from services.api.main import app

          with TestClient(app) as client:
              response = client.get("/api/health")
              assert response.status_code == 200, response.text
              assert response.json()["status"] == "ok"
              # Every non-public endpoint must reject an unauthenticated caller.
              assert client.post("/api/runs/R-x/chat", json={"question": "hi"}).status_code == 401
          print("API health and auth boundary verified.")
          PY

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        # Proves the standalone output the container image depends on actually builds.
        run: npm run build

  # ---------------------------------------------------------------------------
  # Container images build (no push -- cd.yml does that)
  # ---------------------------------------------------------------------------
  containers:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [governance]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/containers/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/containers/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Single required status. Branch protection points at this one job rather than at
  # each job above, so adding a job does not mean editing the protection rule.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [governance, api, web, containers]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
