[pytest]
# `testpaths` exists to make a bare `pytest` locally collect the same set CI collects.
#
# The V2 reference tree (Project_AEGIS_Pharma_AI_FDE_Capstone_Workshop_Ready_v2_claude/)
# is gitignored, so it is absent in a CI checkout and present on a developer's machine --
# which meant a bare `pytest` failed at collection locally and passed in CI, on the same
# commit. Its tests import a `submission` package that only resolves from inside that
# tree; they are V1's own suite and are not part of V2's contract.
testpaths = tests
norecursedirs =
    Project_AEGIS_Pharma_AI_FDE_Capstone_Workshop_Ready_v2_claude
    eval-ai-cache
    node_modules
    .git
    __pycache__

# Markers are declared in conftest.py (pytest_configure) alongside the sys.path setup that
# makes `packages.*` / `services.*` importable; they are deliberately not duplicated here.
addopts = --strict-markers
